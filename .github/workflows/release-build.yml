name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0, v0.1.0, or latest)'
        required: true
        default: 'latest'
        type: string
      clear_cache:
        description: 'Delete existing Rust build caches before building'
        required: false
        default: false
        type: boolean

  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 版本准备 ─────────────────────────────────────────────
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag_name: ${{ steps.version.outputs.TAG_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${INPUT_VERSION}"

            if [[ "$VERSION" == "latest" ]]; then
              VERSION=$(awk '
                /^\[package\]/ { package=1; next }
                /^\[/ { package=0 }
                package && /^version[[:space:]]*=/ {
                  gsub(/"/, "", $3)
                  print $3
                  exit
                }
              ' Cargo.toml)
            fi

            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "ERROR: Unable to determine release version."
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=${TAG}" >> "$GITHUB_OUTPUT"

  # ── 删除构建缓存（可选）──────────────────────────────────
  clear-cache:
    name: Clear build cache
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.clear_cache

    steps:
      - name: Delete Rust build caches
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const targets = caches.filter(cache =>
              cache.key.startsWith('Linux-cargo-')
            );

            for (const cache of targets) {
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id
              });
            }

            core.info(`Deleted ${targets.length} Rust build caches.`);

  # ── 多平台构建 ───────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [prepare, clear-cache]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.clear-cache.result == 'success' || needs.clear-cache.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 仅修改 Runner 工作目录，不提交或推送回仓库
      - name: Update Cargo.toml version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re

          path = "Cargo.toml"
          version = os.environ["VERSION"]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r'(?ms)(^\[package\]\s*$.*?^\s*version\s*=\s*)("[^"]*")'

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + f'"{version}"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Cannot find explicit version in [package] of Cargo.toml"
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(updated)

          print(f"Cargo.toml version updated to {version}")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            Linux-cargo-${{ matrix.target }}-

      - name: Build
        run: cross build --target ${{ matrix.target }} --release

      - name: Package
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET="${{ matrix.target }}"
          BIN_NAME="mtproto"
          PKG_DIR="mtproto-v${VERSION}"
          PKG_FILE="${BIN_NAME}-${TARGET}-v${VERSION}.tar.gz"

          mkdir -p "${PKG_DIR}"

          cp "target/${TARGET}/release/${BIN_NAME}" "${PKG_DIR}/"

          for FILE in config.example.yaml; do
            if [[ -f "$FILE" ]]; then
              cp "$FILE" "${PKG_DIR}/"
            fi
          done

          tar -czf "${PKG_FILE}" -C "${PKG_DIR}" .

          rm -rf "${PKG_DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: mtproto-${{ matrix.target }}-v${{ needs.prepare.outputs.version }}.tar.gz
          if-no-files-found: error

  # ── 发布 Release ─────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: ./artifacts/*.tar.gz
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
