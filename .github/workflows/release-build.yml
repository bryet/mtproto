name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0, v0.1.0, or latest)'
        required: true
        default: 'latest'
        type: string
      clear_cache:
        description: 'Delete existing Rust build caches before building'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

# Serialize this workflow so cache clearing cannot race another release build.
concurrency:
  group: release-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Determine and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 -I - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          if os.environ["GITHUB_EVENT_NAME"] == "push":
              version = os.environ["GITHUB_REF_NAME"]
          else:
              version = os.environ["INPUT_VERSION"]
              if version == "latest":
                  with open("Cargo.toml", "rb") as file:
                      version = tomllib.load(file)["package"]["version"]
          version = version.removeprefix("v")
          number = r"(?:0|[1-9][0-9]*)"
          identifier = r"(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          pattern = rf"{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?"
          if len(version) > 100 or re.fullmatch(pattern, version) is None:
              raise SystemExit("ERROR: Use a valid version such as 0.1.0 or 0.1.0-rc.1")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"VERSION={version}\nTAG_NAME=v{version}\n")
          PY

  clear-cache:
    name: Clear build cache
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.clear_cache
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete Rust build caches
        uses: actions/github-script@v7
        with:
          script: |
            const pages = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            // Accept both normalized cache entries and wrapped API pages.
            const caches = pages.flatMap(page => page.actions_caches ?? [page]);
            const targets = caches.filter(cache => cache.key.startsWith('Linux-cargo-'));
            for (const cache of targets) {
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.info(`Deleted ${targets.length} Rust build caches.`);

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [prepare, clear-cache]
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.clear-cache.result == 'success' || needs.clear-cache.result == 'skipped')
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set package and lockfile release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 -I - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = os.environ["VERSION"]
          manifest = Path("Cargo.toml")
          lockfile = Path("Cargo.lock")
          text = manifest.read_text()
          with manifest.open("rb") as file:
              package = tomllib.load(file)["package"]
          # Restrict edits to the package's version, never a dependency version.
          sections = re.split(r"(?m)(?=^\[)", text)
          changed = 0
          for index, section in enumerate(sections):
              if section.startswith("[package]"):
                  sections[index], count = re.subn(
                      r'(?m)^(\s*version\s*=\s*)"[^"\n]*"',
                      lambda match: f'{match.group(1)}"{version}"', section, count=1)
                  changed += count
          if changed != 1:
              raise SystemExit("ERROR: Package version not found")
          lock_text = lockfile.read_text()
          blocks = lock_text.split("[[package]]")
          changed = 0
          for index in range(1, len(blocks)):
              block = tomllib.loads("[[package]]" + blocks[index])["package"][0]
              if block["name"] == package["name"] and "source" not in block:
                  blocks[index], count = re.subn(
                      r'(?m)^version\s*=\s*"[^"\n]*"',
                      lambda _: f'version = "{version}"', blocks[index], count=1)
                  changed += count
          if changed != 1:
              raise SystemExit("ERROR: Root package missing from Cargo.lock")
          manifest.write_text("".join(sections))
          lockfile.write_text("[[package]]".join(blocks))
          PY
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            Linux-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-
            Linux-cargo-${{ matrix.target }}-
      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          cross build --locked --release --bin mtproto --target "$TARGET"
          BINARY="target/$TARGET/release/mtproto"
          readelf -l "$BINARY" > "$RUNNER_TEMP/program-headers"
          readelf -d "$BINARY" > "$RUNNER_TEMP/dynamic-section"
          if grep -q 'INTERP' "$RUNNER_TEMP/program-headers" || grep -q '(NEEDED)' "$RUNNER_TEMP/dynamic-section"; then
            echo '::error::Release binary must be statically linked'
            exit 1
          fi
          PACKAGE="mtproto-$TARGET-v$VERSION.tar.gz"
          STAGING="$(mktemp -d "$RUNNER_TEMP/mtproto-package.XXXXXX")"
          cp "$BINARY" config.example.yaml "$STAGING/"
          tar -czf "$PACKAGE" -C "$STAGING" mtproto config.example.yaml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: mtproto-${{ matrix.target }}-v${{ needs.prepare.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    # Override the implicit success() guard: optional cache cleanup may be
    # skipped upstream even when preparation and every build have succeeded.
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.build.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mtproto-${{ needs.prepare.outputs.version }}-*
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*.tar.gz
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
